[project]
name = "tinyllm"
version = "0.1.0"
description = "End-to-end LLM lifecycle: pretrain on Colab, serve locally with llama.cpp"
readme = "README.md"
requires-python = ">=3.10"

# LOCAL TIER DEPENDENCIES ONLY -- there is deliberately no torch here.
#
# This laptop has ~2.1 GB free disk. A PyTorch CPU install alone is ~1.2 GB
# unpacked, which would leave no room for anything else. All training and all
# GGUF conversion happens on Colab; the laptop only quantizes, serves, and
# analyses. See docs/09-quantization.md for the disk budget.
dependencies = [
    "huggingface-hub>=0.30",   # pull model artifacts from the Hub
    "gguf>=0.10",              # read GGUF metadata/tensors without llama.cpp
    "tokenizers>=0.21",        # inspect the tokenizer (Rust, ~10 MB, no torch)
    "sentencepiece>=0.2",      # load tokenizer.model directly
    "numpy>=1.26",
    "matplotlib>=3.8",         # loss curves, quantization tradeoff plots
    "openai>=1.60",            # llama-server speaks the OpenAI API
    "requests>=2.31",
    "rich>=13.7",              # streaming terminal chat client
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local Jupyter kernel for notebooks/local/*.
notebook = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

# NEVER install this group on the local tier -- it will not fit on disk.
# Listed only as documentation of what the Colab tier needs; Colab already
# ships torch, and notebooks/colab/00_bootstrap installs the rest.
colab = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyllm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
